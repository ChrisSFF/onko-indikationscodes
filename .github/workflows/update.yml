name: Monatliche Aktualisierung

on:
  schedule:
    # 2. Tag jedes Monats, 05:17 UTC (die SL wird jeweils auf den 1. aktualisiert)
    - cron: "17 5 2 * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", "data/shorttexts_by_text.json", ".github/workflows/update.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install openpyxl==3.1.5

      - name: BAG-Daten laden und Liste neu erstellen
        env:
          # optional: macht Kurztexte für neue Codes mit Claude (sonst automatische Kürzung)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/build.py

      - name: Änderungen speichern
        run: |
          git config user.name "onko-codes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Aktualisierung BAG-SL $(date -u +%Y-%m-%d)"
            git push
          fi
